name: Final branch verification

on:
  push:
    branches:
      - fix/trade-download-wait-stability

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node check.cjs
      - run: |
          git fetch origin main --depth=1
          git diff --check origin/main HEAD
