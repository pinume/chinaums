name: branch-check
on:
  push:
    branches:
      - fix/account-query-controls-missing
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node check.cjs
      - run: |
          git fetch origin main --depth=1
          git diff --check origin/main HEAD
